#generated by scan_Nx_m0.2.sh
outputFile = "configs/dwf_beta_3.0_m_0.2_Nx_48_Nt_64_N5_16.h5"

[physics]
beta = 3.0
fMass = 0.2
fermionAction = "dwf"
dim5 = 16
M5 = 1.0

[lattice]
dimx = 48
dimt = 64

[run]
targetConfigs = 20000
burnIn = 300
nChains = 16
backend = "gpu"
randSeed = 0
#exactly reversible integrator: force CG restarted from zero each substep.
#Only reaches the volumes not yet generated (48/64); the 8-32 ensembles on
#disk were warm-started (their coldStartForce attr says so).
coldStartForce = true

[substeps]
#auto-tune per volume: the heavy mass tunes low (33/35/45 at Nx=8/16/32), so
#the 200 ceiling has plenty of headroom for the ~50-60 expected at 48/64
targetAcceptance = 0.85
pilotSteps = 50
startSubSteps = 30
maxSubSteps = 200
