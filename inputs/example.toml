#gauge generation input for run_sim.py:  python run_sim.py inputs/example.toml
#(values here reproduce the ryanComp ensemble)

outputFile = "configs/ryanComp.h5"

[physics]
beta = 2.0
fMass = 0.2
aSpacing = 1.0      #optional, default 1.0
#fermionAction = "wilson"  #optional: "wilson" (default) or "dwf"
#dim5 = 8                  #dwf only: extent of the 5th dimension
#M5 = 1.0                  #dwf only: domain wall height (0 < M5 < 2)

[lattice]
dimx = 8
dimt = 16

[run]
targetConfigs = 5000   #total thermalized configurations after merging chains
burnIn = 500           #discarded from the START of each chain before merging
nCores = 10            #optional, default: all cores
#backend = "cpu"       #optional: "cpu" (joblib chains, default) or "gpu"
#                      #(vmapped jax chains; dwf only, nCores ignored, ~64 chains is the sweet spot)
#nChains = 10          #optional, default: nCores (chain i uses randSeed + i)
#randSeed = 0          #optional base seed
#cgRtolForce = 1e-5    #optional CG tolerance for the MD force solves (metropolis-corrected, may run loose)
#cgRtolAction = 1e-10  #optional CG tolerance for the action solves in dH (kept tight; errors here bias the ensemble)
#cgRtol = 1e-5         #deprecated: old single tolerance, honored as cgRtolForce

[substeps]
#give numSubSteps to use a fixed value, or omit it to tune automatically.
#
#tuning reads each pilot as a measurement of the integrator's energy error:
#<dH> = C * n^-p and P = erfc(sqrt(<dH>/2)), so a measured acceptance inverts
#to <dH> and the substep count hitting targetAcceptance follows from the model.
#The first pilot already predicts an answer (at the theoretical p = 4); later
#pilots refit p as well. Typically 4-6 pilots instead of 8.
numSubSteps = 20
#targetAcceptance = 0.8   #acceptance the tuned count must reach
#pilotSteps = 100         #trajectories per pilot (second half is measured)
#startSubSteps = 5        #first count tried
#maxSubSteps = 500        #hard ceiling; unreachable target below it is an error
#maxPilots = 12           #pilot budget; on exhaustion the best count is used
#
#pilotChains: chains per pilot. Defaults to nChains on the gpu (acceptance is
#per-chain, so a wider batch is cheaper noise reduction than more pilot steps)
#and to 1 on the cpu.
#pilotChains = 16
#
#confirmSteps: after tuning, re-measure the chosen count on a seed the search
#never saw, and report the acceptance with its error. The search pilots all
#share randSeed (common random numbers), so this is what catches a count that
#only looked good on that one seed. Also runs when numSubSteps is set by hand,
#so a stale copied value cannot quietly run an ensemble off-target.
#Defaults to pilotSteps; set 0 to skip (~35% cheaper tuning, ~5x more runs
#landing more than 0.03 under target).
#confirmSteps = 100
