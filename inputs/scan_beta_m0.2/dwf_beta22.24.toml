#generated by scan_beta_m0.2.sh
outputFile = "configs/dwf_beta_22.24_m_0.2_Nx_32_Nt_32_N5_16.h5"

[physics]
beta = 22.24
fMass = 0.2
fermionAction = "dwf"
dim5 = 16
M5 = 1.0

[lattice]
dimx = 32
dimt = 32

[run]
targetConfigs = 20000
burnIn = 300
nChains = 16
backend = "gpu"
randSeed = 0

[substeps]
#auto-tune per beta. beta multiplies the gauge action, so the force — and with
#it the substep requirement — grows with beta: the beta=3 -> 10 step at Nx=32
#moved m=0.05 from 48 to 60 substeps, roughly beta^0.19. Extrapolated to
#beta=100 that is ~2x the beta=3 count, and m=0.2 at this volume tuned to 45,
#so ~90 is the expectation at the top end. Ceiling 400 leaves wide headroom;
#tuning runs before production, so an over-tight cap wastes only the pilot.
targetAcceptance = 0.85
pilotSteps = 50
startSubSteps = 30
maxSubSteps = 400
