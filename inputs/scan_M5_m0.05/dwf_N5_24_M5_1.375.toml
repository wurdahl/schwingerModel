#generated by scan_M5_m0.05.sh
outputFile = "configs/dwf_beta_3.0_m_0.05_Nx_32_Nt_64_N5_24_M5_1.375.h5"

[physics]
beta = 3.0
fMass = 0.05
fermionAction = "dwf"
dim5 = 24
M5 = 1.375

[lattice]
dimx = 32
dimt = 64

[run]
targetConfigs = 20000
burnIn = 300
nChains = 16
backend = "gpu"
randSeed = 0

[substeps]
#auto-tune per point: the kernel spectrum moves with M5, so each point finds
#its own substep count. Search starts at 15 (was 30) since the ratio action of
#commit dcf762d gave 0.95 acceptance at 33 substeps where the old two-
#pseudofermion action gave 0.85; the tuner extrapolates up if 15 is too few.
targetAcceptance = 0.85
pilotSteps = 50
startSubSteps = 15
maxSubSteps = 400
