#generated by scan_Nx_m0.0.sh
outputFile = "configs/dwf_beta_3.0_m_0.0_Nx_48_Nt_64_N5_16.h5"

[physics]
beta = 3.0
fMass = 0.0
fermionAction = "dwf"
dim5 = 16
M5 = 1.0

[lattice]
dimx = 48
dimt = 64

[run]
targetConfigs = 20000
burnIn = 300
nChains = 16
backend = "gpu"
randSeed = 0
#exactly reversible integrator: force CG restarted from zero each substep
coldStartForce = true

[substeps]
#auto-tune per volume: the light mass and changing volume both move the
#acceptance, so each Nx finds its own substep count. Ceiling raised 400 -> 600
#on 2026-08-10: the m=0.01 scan tuned Nx=64 to *exactly* 400, i.e. it landed on
#its ceiling (0.88 there, first count to clear 0.85) and was one probe away from
#the maxSubSteps RuntimeError. m=0 is lighter still, so 400 would very likely
#have aborted at the big volumes. The Schur force is gentler, which may pull
#tuned counts back down -- 600 is only a ceiling, so it costs nothing if unused.
targetAcceptance = 0.85
pilotSteps = 50
startSubSteps = 30
maxSubSteps = 600
