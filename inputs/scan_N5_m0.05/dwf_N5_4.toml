#generated by scan_N5_m0.05.sh
outputFile = "configs/dwf_beta_3.0_m_0.05_Nx_32_Nt_64_N5_4.h5"

[physics]
beta = 3.0
fMass = 0.05
fermionAction = "dwf"
dim5 = 4
M5 = 1.0

[lattice]
dimx = 32
dimt = 64

[run]
targetConfigs = 20000
burnIn = 300
nChains = 16
backend = "gpu"
randSeed = 0

[substeps]
#auto-tune per N5: the fermion force changes with the 5th dimension, so each
#N5 finds its own substep count. Ceiling 400 (not the anchor's 200) in case a
#small-N5 point needs a doubling past 200, as Nx=48 did in the m=0.01 scan.
targetAcceptance = 0.85
pilotSteps = 50
startSubSteps = 30
maxSubSteps = 400
