#generated by scan_N5_m0.0.sh
outputFile = "configs/dwf_beta_3.0_m_0.0_Nx_32_Nt_64_N5_8.h5"

[physics]
beta = 3.0
fMass = 0.0
fermionAction = "dwf"
dim5 = 8
M5 = 1.0

[lattice]
dimx = 32
dimt = 64

[run]
targetConfigs = 20000
burnIn = 300
nChains = 16
backend = "gpu"
randSeed = 0
#exactly reversible integrator: force CG restarted from zero each substep
coldStartForce = true

[substeps]
#auto-tune per N5: the fermion force changes with the 5th dimension, so each
#N5 finds its own substep count. Ceiling 600 as in the m=0 volume scan: at
#m=0 the force is at its stiffest, and 600 is only a ceiling.
targetAcceptance = 0.85
pilotSteps = 50
startSubSteps = 30
maxSubSteps = 600
