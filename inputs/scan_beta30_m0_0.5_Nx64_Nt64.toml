#generated by scan_m0.sh — bare-mass scan at beta=30, 64x64
#settings match inputs/veryLightMelted.toml except fMass, nCores and nChains

outputFile = "configs/beta_30_m0_0.5_Nx_64_Nt_64_melted.h5"

[physics]
beta = 30
fMass = 0.5
aSpacing = 1.0

[lattice]
dimx = 64
dimt = 64

[run]
metroSteps = 50000     #total configs across all chains
burnIn = 500           #discarded from the START of each chain
nCores = 24
nChains = 24    #chain i uses randSeed + i
cgRtol = 1e-5
tunneling = true

[substeps]
#fixed, not tuned — see scan_m0.sh header: coarse steps cannot escape the cold
#start at this volume, and tunneling shaves thermalized acceptance; 200 holds 1.00
numSubSteps = 200
